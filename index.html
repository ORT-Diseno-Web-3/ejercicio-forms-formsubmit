<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Formularios</title>
        <link rel="stylesheet" href="css/estilos.css" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
            rel="stylesheet"
        />
    </head>

    <body>
        <header class="hero">
            <h1>Contacto</h1>
        </header>
        <main class="contenedor">
            <form
                action="https://formsubmit.co/refinan-nupcial-1y@icloud.com"
                method="post"
            >
                <input
                    type="hidden"
                    name="_subject"
                    value="[Test] Contact form"
                />
                <input type="hidden" name="_template" value="box" />
                <input type="hidden" name="_next" value="https://dw3-ejercicio-forms.netlify.app/gracias.html" />
                <div class="dos-columnas">
                    <div>
                        <label for="nombre">Nombre</label>
                        <input
                            type="text"
                            id="nombre"
                            name="nombre"
                            placeholder="John"
                            required
                        />
                    </div>
                    <div>
                        <label for="apellido">Apellido</label>
                        <input
                            type="text"
                            id="apellido"
                            name="apellido"
                            placeholder="Doe"
                            required
                        />
                    </div>
                </div>
                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="johndoe@example.com"
                    required
                />
                <label for="comentarios">Mensaje</label>
                <textarea
                    name="comentarios"
                    id="comentarios"
                    cols="30"
                    rows="10"
                    placeholder="Cuentanos lo que quieras"
                    required
                ></textarea>
                <div class="form-footer">
                    <div>
                        <input type="checkbox" id="terminos" required />
                        <label for="terminos"
                            >Acepto los términos y condiciones</label
                        >
                    </div>

                    <button type="submit">Enviar</button>
                </div>
            </form>
        </main>
    </body>
</html>
